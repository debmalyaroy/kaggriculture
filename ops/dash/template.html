<title>RL Learning Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f5f1;--surface:#ffffff;--ink:#1b211c;--muted:#5d685f;--line:#dce1d8;--grid:#e9ece6;
  --accent:#2b6c8a;--ochre:#b7791f;--good:#2f7d46;--bad:#b0412e;--warn:#b7791f;--plum:#7a4f86;--sage:#8a9a8c;
  --chip-good:#e3f1e6;--chip-bad:#f7e3df;--chip-warn:#f6ecd9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#111513;--surface:#191e1a;--ink:#e3e8e1;--muted:#98a399;--line:#2a312b;--grid:#222823;
  --accent:#6fb0cf;--ochre:#d9a24a;--good:#5cb87a;--bad:#e0725c;--warn:#d9a24a;--plum:#b98cc6;--sage:#7d8c7f;
  --chip-good:#1d3324;--chip-bad:#3a221d;--chip-warn:#3a2f1a;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#111513;--surface:#191e1a;--ink:#e3e8e1;--muted:#98a399;--line:#2a312b;--grid:#222823;
  --accent:#6fb0cf;--ochre:#d9a24a;--good:#5cb87a;--bad:#e0725c;--warn:#d9a24a;--plum:#b98cc6;--sage:#7d8c7f;
  --chip-good:#1d3324;--chip-bad:#3a221d;--chip-warn:#3a2f1a;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 48px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--cond);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:14px;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill.good{background:var(--chip-good);border-color:transparent;color:var(--good)}
.pill.bad{background:var(--chip-bad);border-color:transparent;color:var(--bad)}
.pill.warn{background:var(--chip-warn);border-color:transparent;color:var(--warn)}
.top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.top{grid-template-columns:1fr}}
.reading{display:flex;flex-direction:column;gap:10px}
.reading p{margin:0;max-width:68ch}
.reading ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.wdl{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--grid)}
.wdl span{display:block;height:100%}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{display:flex;flex-direction:column}
.kv .v{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.kv .k{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
figcaption{display:flex;flex-direction:column;gap:2px}
figcaption p{margin:0;color:var(--muted);font-size:12.5px}
.chart{position:relative;height:230px;width:100%}
section{display:flex;flex-direction:column;gap:10px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--surface);position:sticky;top:0}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child,td.l,th.l{text-align:left}
td.l{font-family:var(--sans)}
tr:last-child td{border-bottom:none}
.ok{color:var(--good)}.no{color:var(--bad)}.dim{color:var(--muted)}
pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.45;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.events{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12.5px;max-width:90ch}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Kaggriculture RL · box A (c8g.16xlarge, ap-south-1)</div>
      <h1>RL Learning Board</h1>
      <div class="dim" id="stamp"></div>
    </div>
    <div class="pills" id="pills"></div>
  </header>

  <div class="top">
    <div class="reading">
      <div class="eyebrow">Reading of the numbers</div>
      <h2 id="headline"></h2>
      <ul id="points"></ul>
    </div>
    <div class="verdict" id="verdict"></div>
  </div>

  <section>
    <h2>Learning</h2>
    <div class="grid">
      <figure><figcaption><h3>Validation vs v63</h3><p>800 greedy games on held-out seeds 600000+, every 10 iterations. Green wins, grey draws (exact mirrors), red losses.</p></figcaption><div class="chart"><canvas id="c_val"></canvas></div></figure>
      <figure><figcaption><h3>Training games</h3><p>Win rate and reward over the 8,192 games of each iteration (the opponent mix, 30% real players' tapes).</p></figcaption><div class="chart"><canvas id="c_train"></canvas></div></figure>
      <figure><figcaption><h3>Profiles the policy plays</h3><p>Share of daily choices in each iteration's rollouts, by profile.</p></figcaption><div class="chart"><canvas id="c_mix"></canvas></div></figure>
      <figure><figcaption><h3>Policy spread and leash</h3><p>Entropy (nats; ln 34 = 3.53 is uniform) and KL to the anchor prior against its 0.3 target.</p></figcaption><div class="chart"><canvas id="c_pol"></canvas></div></figure>
      <figure><figcaption><h3>Learning rate and KL coefficient</h3><p>Adam step size and the adaptive KL penalty (log scale).</p></figcaption><div class="chart"><canvas id="c_lr"></canvas></div></figure>
      <figure><figcaption><h3>Branch oracle</h3><p>Accuracy of the policy on the oracle's best profile, and the loss on those labels.</p></figcaption><div class="chart"><canvas id="c_orc"></canvas></div></figure>
      <figure><figcaption><h3>Oracle regret</h3><p>Win-probability points the policy gives up against the oracle's best profile on labelled close decisions (lower is better), vs always playing v63.</p></figcaption><div class="chart"><canvas id="c_reg"></canvas></div></figure>
      <figure><figcaption><h3>Oracle batches</h3><p>Per 256-game batch: decisions branched and the ones where the day's profile changed the margin.</p></figcaption><div class="chart"><canvas id="c_orcb"></canvas></div></figure>
      <figure><figcaption><h3>Iteration time</h3><p>Seconds waiting for games vs updating weights, and games per second.</p></figcaption><div class="chart"><canvas id="c_time"></canvas></div></figure>
      <figure><figcaption><h3>Box load</h3><p>CPU busy % across 64 cores and RAM used, one point per dashboard poll.</p></figcaption><div class="chart"><canvas id="c_box"></canvas></div></figure>
      <figure><figcaption><h3>Current profile mass</h3><p>The policy's mean probability per profile on the newest iteration (top 12).</p></figcaption><div class="chart"><canvas id="c_mass"></canvas></div></figure>
    </div>
  </section>

  <section>
    <h2>Changes during this run</h2>
    <ul class="events" id="events"></ul>
  </section>

  <section>
    <h2>Recent iterations</h2>
    <div class="tbl"><table id="t_it"></table></div>
  </section>

  <div class="two">
    <section><h2>Validation history</h2><div class="tbl"><table id="t_val"></table></div></section>
    <section><h2>Oracle batches</h2><div class="tbl"><table id="t_orc"></table></div></section>
  </div>

  <section>
    <h2>Gates and candidates</h2>
    <div class="tbl"><table id="t_gate"></table></div>
  </section>

  <section>
    <h2>Queue</h2>
    <pre id="queue"></pre>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const IST = t => t ? new Date(t).toLocaleString("en-GB", {timeZone: "Asia/Kolkata", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: false}) + " IST" : "";
const ISTs = t => t ? new Date(t).toLocaleTimeString("en-GB", {timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: false}) : "";
const f = (x, d = 3) => x == null || isNaN(x) ? "–" : Number(x).toFixed(d);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));

const run = [...D.runs].reverse().find(r => /-p36-/.test(r.name)) || D.runs[D.runs.length - 1];
const M = run ? run.metrics : [];
const names = D.profile_names;
const gps = r => { const m = /\(([\d.]+) g\/s\)/.exec(r.rollout || ""); return m ? +m[1] : null; };
const vals = M.filter(r => r.val_win != null).map(r => {
  const m = /W (\d+) D (\d+) L (\d+)/.exec(r.val || ""), w = /learner wins (\d+)/.exec(r.val || "");
  const n = 800;
  if (m) return {iter: r.iter, t: r.t, score: r.val_win, W: +m[1], D: +m[2], L: +m[3], exact: true};
  const W = w ? +w[1] : null; // older rows: wins only; draws and losses solved from the mean score
  const Dr = W == null ? null : Math.round(2 * (r.val_win * n - W)), L = W == null ? null : n - W - Dr;
  return {iter: r.iter, t: r.t, score: r.val_win, W, D: Dr, L, exact: false};
});
const last = M[M.length - 1] || {};
const lv = vals[vals.length - 1];

// header
$("stamp").textContent = `Snapshot ${IST(D.t)} · run ${run ? run.name : "–"} · iteration ${last.iter ?? "–"}`;
const q = D.queue || "";
const qs = id => { const m = new RegExp("^" + id + "\\s+\\S+\\s+\\S+\\s+(\\S+)", "m").exec(q); return m ? m[1] : "?"; };
const pill = (txt, cls) => `<span class="pill ${cls || ""}">${esc(txt)}</span>`;
const b = D.box || {};
$("pills").innerHTML = [
  pill("PPO " + qs("Q16"), qs("Q16") === "running" ? "good" : "bad"),
  pill("Oracle " + qs("Q19"), qs("Q19") === "running" ? "good" : "bad"),
  pill(`CPU ${f(b.cpu_pct, 0)}%`, b.cpu_pct > 85 ? "good" : "warn"),
  pill(`RAM ${f(b.mem_used_gb, 0)} / ${f(b.mem_total_gb, 0)} GB`),
  pill(`Disk free ${f(b.disk_free_gb, 0)} GB`, b.disk_free_gb < 15 ? "bad" : ""),
].join("");

// reading
const N = D.notes || {};
$("headline").textContent = N.headline || "No written reading yet for this snapshot.";
$("points").innerHTML = (N.points || []).map(p => `<li>${esc(p)}</li>`).join("");

// verdict
(function () {
  const v = $("verdict");
  if (!lv) { v.innerHTML = `<div class="eyebrow">Beats v63?</div><h2>No validation yet</h2>`; return; }
  const tot = (lv.W || 0) + (lv.D || 0) + (lv.L || 0) || 1;
  const beats = lv.W > lv.L;
  const band = (D.gates || []).filter(g => /^band__/.test(g.file)).slice(-1)[0];
  v.innerHTML = `<div class="eyebrow">Beats v63? · latest validation, iteration ${lv.iter}</div>
    <h2>${beats ? "Ahead of v63 on held-out seeds" : lv.W === lv.L ? "Level with v63" : "Behind v63"}${lv.exact ? "" : " (W/D/L solved from the mean)"}</h2>
    <div class="wdl"><span style="width:${100 * lv.W / tot}%;background:var(--good)"></span><span style="width:${100 * lv.D / tot}%;background:var(--sage)"></span><span style="width:${100 * lv.L / tot}%;background:var(--bad)"></span></div>
    <div class="kv"><div><span class="v ok">${lv.W}</span><span class="k">wins</span></div><div><span class="v">${lv.D}</span><span class="k">draws</span></div><div><span class="v no">${lv.L}</span><span class="k">losses</span></div></div>
    <div class="dim">Score ${f(lv.score, 4)} (0.5 = level). A candidate must also pass the band gate on real players' tapes: 0 losses below 2500 and ≥ 90% wins at 2500+.
    ${band ? `Last band gate: ${esc(band.name)} vs ${esc(band.ref)}: ${band.losses_below_2500} losses below 2500, ${f(100 * band.win_rate_2500plus, 1)}% at 2500+, ${band.pass ? "PASS" : "not passed"}.` : ""}</div>`;
})();

// events
$("events").innerHTML = (D.events || []).map(e => `<li><span class="num">${IST(e.t)}</span> · iteration ${e.iter}: ${esc(e.what)}</li>`).join("");

// charts
Chart.defaults.font.family = css("--sans").split(",")[0].replace(/"/g, "");
Chart.defaults.font.size = 11;
const evLines = {
  id: "evLines",
  afterDatasetsDraw(ch) {
    const x = ch.scales.x; if (!x || ch.config.options.noEvents) return;
    const {top, bottom} = ch.chartArea, c = ch.ctx;
    c.save(); c.strokeStyle = css("--ochre"); c.setLineDash([4, 3]); c.lineWidth = 1;
    for (const e of D.events || []) {
      const px = x.getPixelForValue(e.iter);
      if (px >= ch.chartArea.left && px <= ch.chartArea.right) { c.beginPath(); c.moveTo(px, top); c.lineTo(px, bottom); c.stroke(); }
    }
    c.restore();
  }
};
Chart.register(evLines);
const charts = [];
function base(yopts = {}, extra = {}) {
  const g = css("--grid"), m = css("--muted");
  return Object.assign({
    responsive: true, maintainAspectRatio: false, animation: false, interaction: {mode: "index", intersect: false},
    plugins: {legend: {labels: {color: m, boxWidth: 10, boxHeight: 10}}, tooltip: {}},
    scales: {x: {type: "linear", ticks: {color: m, precision: 0}, grid: {color: g}, title: {display: true, text: "iteration", color: m}},
             y: Object.assign({ticks: {color: m}, grid: {color: g}}, yopts)}
  }, extra);
}
const pts = (key, fn) => M.filter(r => (fn ? fn(r) : r[key]) != null).map(r => ({x: r.iter, y: fn ? fn(r) : r[key]}));
const line = (label, data, color, o = {}) => Object.assign({label, data, borderColor: color, backgroundColor: color, pointRadius: 0, borderWidth: 1.8, tension: .2}, o);

function draw() {
  charts.forEach(c => c.destroy()); charts.length = 0;
  const C = k => css(k);
  charts.push(new Chart($("c_val"), {type: "bar", data: {labels: vals.map(v => v.iter), datasets: [
    {label: "wins", data: vals.map(v => v.W), backgroundColor: C("--good"), stack: "s"},
    {label: "draws", data: vals.map(v => v.D), backgroundColor: C("--sage"), stack: "s"},
    {label: "losses", data: vals.map(v => v.L), backgroundColor: C("--bad"), stack: "s"}]},
    options: base({stacked: true, max: 800, title: {display: true, text: "games of 800", color: C("--muted")}},
      {noEvents: true, scales: {x: {stacked: true, ticks: {color: C("--muted")}, grid: {display: false}, title: {display: true, text: "iteration", color: C("--muted")}},
        y: {stacked: true, max: 800, ticks: {color: C("--muted")}, grid: {color: C("--grid")}}}})}));
  charts.push(new Chart($("c_train"), {type: "line", data: {datasets: [
    line("win rate", pts("win"), C("--accent")), line("reward", pts("reward"), C("--ochre"))]}, options: base({min: 0.6, max: 1})}));
  // profile mix (played shares; older rows lack it)
  const groups = [[35, "v63 (35)", C("--accent")], [34, "p19_v92ext (34)", C("--plum")], [33, "p19_v92 (33)", C("--ochre")], [32, "p0_v92 (32)", "#c9a86a"],
                  [19, "ad_rsa12_l24 (19)", C("--good")], [31, "p19_afr (31)", "#6f9a7a"], [0, "v61.1 (0)", C("--bad")]];
  const withP = M.filter(r => r.played);
  const ds = groups.map(([k, lab, col]) => ({label: lab, data: withP.map(r => ({x: r.iter, y: r.played[k]})), backgroundColor: col, borderColor: col, fill: true, pointRadius: 0, borderWidth: 0}));
  ds.push({label: "other", data: withP.map(r => ({x: r.iter, y: 1 - groups.reduce((s, [k]) => s + r.played[k], 0)})), backgroundColor: C("--sage"), borderColor: C("--sage"), fill: true, pointRadius: 0, borderWidth: 0});
  charts.push(new Chart($("c_mix"), {type: "line", data: {datasets: ds}, options: base({stacked: true, min: 0, max: 1},
    {plugins: {legend: {labels: {color: C("--muted"), boxWidth: 10, boxHeight: 10, font: {size: 10}}}, title: {display: !withP.length, text: "Recorded from iteration 29 on (new metric)", color: C("--muted")}}})}));
  charts.push(new Chart($("c_pol"), {type: "line", data: {datasets: [
    line("entropy", pts("ent"), C("--accent"), {yAxisID: "y"}),
    line("KL to anchor", pts("kl_teacher"), C("--ochre"), {yAxisID: "y1"}),
    line("KL target", pts("kl_target"), C("--muted"), {yAxisID: "y1", borderDash: [4, 4], borderWidth: 1})]},
    options: base({title: {display: true, text: "entropy", color: C("--muted")}}, {scales: {x: {type: "linear", ticks: {color: C("--muted")}, grid: {color: C("--grid")}},
      y: {position: "left", ticks: {color: C("--muted")}, grid: {color: C("--grid")}, title: {display: true, text: "entropy", color: C("--muted")}},
      y1: {position: "right", ticks: {color: C("--muted")}, grid: {display: false}, title: {display: true, text: "KL", color: C("--muted")}}}})}));
  charts.push(new Chart($("c_lr"), {type: "line", data: {datasets: [
    line("learning rate", pts("lr"), C("--accent"), {stepped: true}), line("KL coefficient", pts("kl_coef"), C("--ochre"), {stepped: true})]},
    options: base({type: "logarithmic", ticks: {color: C("--muted"), callback: v => Number(v).toExponential(0)}})}));
  charts.push(new Chart($("c_orc"), {type: "line", data: {datasets: [
    line("oracle accuracy", pts("oracle_acc"), C("--good"), {yAxisID: "y"}),
    line("oracle loss (clipped at 5)", pts(null, r => r.oracle_ce == null ? null : Math.min(5, r.oracle_ce)), C("--bad"), {yAxisID: "y1"})]},
    options: base({}, {scales: {x: {type: "linear", ticks: {color: C("--muted")}, grid: {color: C("--grid")}},
      y: {min: 0, max: 1, ticks: {color: C("--muted")}, grid: {color: C("--grid")}, title: {display: true, text: "accuracy", color: C("--muted")}},
      y1: {position: "right", min: 0, ticks: {color: C("--muted")}, grid: {display: false}, title: {display: true, text: "loss", color: C("--muted")}}}})}));
  charts.push(new Chart($("c_reg"), {type: "line", data: {datasets: [
    line("policy, sampled", pts("oracle_regret"), C("--accent")),
    line("policy, greedy", pts("oracle_regret_greedy"), C("--good")),
    line("always v63", pts("oracle_regret_v63"), C("--bad"), {borderDash: [5, 4]})]},
    options: base({min: 0, title: {display: true, text: "points of win probability", color: C("--muted")}},
      {plugins: {legend: {labels: {color: C("--muted"), boxWidth: 10, boxHeight: 10}}, title: {display: !M.some(r => r.oracle_regret != null), text: "Recorded from iteration 83 on (new metric)", color: C("--muted")}}})}));
  const O = D.oracle || [];
  const tsOf = tag => Date.UTC(+tag.slice(0, 4), +tag.slice(4, 6) - 1, +tag.slice(6, 8), +tag.slice(9, 11), +tag.slice(11, 13), +tag.slice(13, 15));
  charts.push(new Chart($("c_orcb"), {type: "bar", data: {labels: O.map(o => ISTs(tsOf(o.tag))), datasets: [
    {label: "choice mattered", data: O.map(o => o.useful), backgroundColor: C("--accent"), stack: "s"},
    {label: "no difference", data: O.map(o => o.decisions - o.useful), backgroundColor: C("--sage"), stack: "s"}]},
    options: base({stacked: true}, {noEvents: true, scales: {x: {stacked: true, ticks: {color: C("--muted"), maxTicksLimit: 10}, grid: {display: false}, title: {display: true, text: "batch (IST)", color: C("--muted")}},
      y: {stacked: true, ticks: {color: C("--muted")}, grid: {color: C("--grid")}, title: {display: true, text: "decisions", color: C("--muted")}}}})}));
  charts.push(new Chart($("c_time"), {type: "line", data: {datasets: [
    line("waiting for games (s)", pts("sec_rollout_wait"), C("--accent"), {yAxisID: "y"}),
    line("update (s)", pts("sec_update"), C("--ochre"), {yAxisID: "y"}),
    line("games / s", pts(null, gps), C("--good"), {yAxisID: "y1"})]},
    options: base({}, {scales: {x: {type: "linear", ticks: {color: C("--muted")}, grid: {color: C("--grid")}},
      y: {min: 0, ticks: {color: C("--muted")}, grid: {color: C("--grid")}, title: {display: true, text: "seconds", color: C("--muted")}},
      y1: {position: "right", min: 0, ticks: {color: C("--muted")}, grid: {display: false}, title: {display: true, text: "games/s", color: C("--muted")}}}})}));
  const H = D.box_history || [];
  charts.push(new Chart($("c_box"), {type: "line", data: {labels: H.map(h => ISTs(h.t)), datasets: [
    line("CPU busy %", H.map(h => h.cpu_pct), C("--accent"), {yAxisID: "y", pointRadius: 2}),
    line("RAM used GB", H.map(h => h.mem_used_gb), C("--ochre"), {yAxisID: "y1", pointRadius: 2})]},
    options: base({}, {noEvents: true, scales: {x: {type: "category", ticks: {color: C("--muted"), maxTicksLimit: 10}, grid: {color: C("--grid")}, title: {display: true, text: "poll (IST)", color: C("--muted")}},
      y: {min: 0, max: 100, ticks: {color: C("--muted")}, grid: {color: C("--grid")}, title: {display: true, text: "CPU %", color: C("--muted")}},
      y1: {position: "right", min: 0, max: Math.ceil((H[0] || b).mem_total_gb || 124), ticks: {color: C("--muted")}, grid: {display: false}, title: {display: true, text: "GB", color: C("--muted")}}}})}));
  const lm = [...M].reverse().find(r => r.mass);
  const top = lm ? lm.mass.map((m, k) => [k, m]).sort((a, c) => c[1] - a[1]).slice(0, 12) : [];
  charts.push(new Chart($("c_mass"), {type: "bar", data: {labels: top.map(([k]) => `${names[k]} (${k})`), datasets: [
    {label: "mass", data: top.map(([, m]) => m), backgroundColor: top.map(([k]) => k === 35 ? C("--accent") : C("--sage"))}]},
    options: base({}, {indexAxis: "y", noEvents: true, plugins: {legend: {display: false}, title: {display: !top.length, text: "Recorded from iteration 29 on (new metric)", color: C("--muted")}},
      scales: {x: {min: 0, ticks: {color: C("--muted")}, grid: {color: C("--grid")}}, y: {ticks: {color: C("--muted"), font: {size: 10}}, grid: {display: false}}}})}));
}
if (window.Chart) draw();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw); new MutationObserver(draw).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]}); } catch (e) {}

// tables
const row = cells => "<tr>" + cells.map(([v, cls]) => `<td class="${cls || ""}">${v}</td>`).join("") + "</tr>";
const head = cols => "<tr>" + cols.map(c => `<th>${c}</th>`).join("") + "</tr>";
$("t_it").innerHTML = head(["iteration", "time IST", "train win", "reward", "val vs v63", "v63 share", "entropy", "KL", "KL coef", "lr", "oracle acc", "regret", "v63 regret", "wait s", "update s", "games/s"]) +
  [...M].reverse().slice(0, 15).map(r => row([[r.iter], [ISTs(r.t)], [f(r.win)], [f(r.reward)], [r.val_win != null ? f(r.val_win, 4) : "–", r.val_win != null ? "" : "dim"],
    [r.played ? f(r.played[35]) : "–", r.played ? "" : "dim"], [f(r.ent)], [f(r.kl_teacher)], [f(r.kl_coef, 4)], [Number(r.lr).toExponential(1)], [f(r.oracle_acc)], [f(r.oracle_regret, 2)], [f(r.oracle_regret_v63, 2)],
    [f(r.sec_rollout_wait, 1)], [f(r.sec_update, 1)], [f(gps(r), 0)]])).join("");
const sg = x => x == null ? "–" : (x > 0 ? "+" : "") + f(x, 3);
const cl = x => x == null ? "dim" : x > 0 ? "ok" : x < 0 ? "no" : "";
$("t_val").innerHTML = head(["iteration", "time IST", "h2h score", "W", "D", "L", "W−L", "panel Δ", "hard Δ", "combo"]) +
  [...vals].reverse().map(v => { const r = M.find(x => x.iter === v.iter) || {};
    return row([[v.iter], [ISTs(v.t)], [f(v.score, 4)], [v.W, "ok"], [v.D], [v.L, "no"], [(v.W - v.L > 0 ? "+" : "") + (v.W - v.L), v.W > v.L ? "ok" : v.W < v.L ? "no" : ""],
      [sg(r.val_panel_d), cl(r.val_panel_d)], [sg(r.val_hard_d), cl(r.val_hard_d)], [sg(r.val_combo), cl(r.val_combo)]]); }).join("") ||
  "<tr><td class='l dim'>No validation yet</td></tr>";
$("t_orc").innerHTML = head(["batch IST", "games", "decisions", "mattered", "share", "seconds"]) +
  [...(D.oracle || [])].reverse().slice(0, 12).map(o => row([[ISTs(tsOf(o.tag))], [o.games], [o.decisions], [o.useful], [f(o.useful / Math.max(1, o.decisions), 2)], [o.sec]])).join("");
const G = (D.gates || []).filter(g => /^band__/.test(g.file)).reverse();
$("t_gate").innerHTML = head(["candidate", "time IST", "reference", "losses <2500", "win 2500+", "ref losses", "ref win", "no worse than ref", "pass"]) +
  (G.map(g => row([[esc(g.name), "l"], [IST(g.t)], [esc(g.ref), "l"], [g.losses_below_2500, g.losses_below_2500 ? "no" : "ok"], [f(100 * g.win_rate_2500plus, 1) + "%"],
    [g.ref_losses_below_2500], [f(100 * g.ref_win_rate_2500plus, 1) + "%"], [g.no_worse_than_ref ? "yes" : "no", g.no_worse_than_ref ? "ok" : "no"], [g.pass ? "PASS" : "no", g.pass ? "ok" : "no"]])).join("") ||
   "<tr><td class='l dim'>No band gate results yet</td></tr>") +
  (D.candidates || []).map(c => row([[esc(c.name) + (c.pending ? " · awaiting laptop leg" : ""), "l"], ["candidate hand-off"], [""], [""], [""], [""], [""], [""], [""]])).join("");
$("queue").textContent = q.trim();
</script>
